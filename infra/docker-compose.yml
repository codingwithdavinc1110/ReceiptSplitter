# Sezione 'version' omessa per evitare problemi di compatibilità del file
# e versioni meno recenti di docker. È necessario avere minimo la versione 3.4 di
# docker-desktop oppure v20.10.13 se utilizzate docker engine dalla linea di comando.

services:
  db:
    image: postgres:18 # una delle versioni dalla pagina ufficiale di docker 
    environment:
      # questi campi vengono compilati dal tuo file .env locale,
      # stessa cosa per REDIS_PASSWORD
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # porta std di postgres : porta di connessione alla propria
                    # macchina
  redis:
    image: redis:8 # una versione dalla pagina ufficiale di docker
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"


